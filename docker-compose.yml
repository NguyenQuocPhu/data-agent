services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: lambda-backend
    ports:
      - "18000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL_ID=${OPENAI_MODEL_ID:-}
      - OPENAI_EXTRA_BODY=${OPENAI_EXTRA_BODY:-}
      - DATA_AGENT_RUNTIME=${DATA_AGENT_RUNTIME:-rlm}
      # Prefer the checked-out RLM source mounted at /opt/rlm over the
      # released package installed in site-packages.
      - PYTHONPATH=/opt/rlm:/app
      - CLEAR_DATASETS_ON_START=${CLEAR_DATASETS_ON_START:-1}
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      - H2O_MAX_MEM_SIZE=${H2O_MAX_MEM_SIZE:-4G}
      - H2O_NTHREADS=${H2O_NTHREADS:--1}
      - H2O_MAX_CONCURRENT_EXPERIMENTS=${H2O_MAX_CONCURRENT_EXPERIMENTS:-1}
    volumes:
      - .:/app
      - ../rlm:/opt/rlm:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./ui/deepanalyze_frontend
      dockerfile: Dockerfile.frontend
    container_name: lambda-frontend
    ports:
      - "3014:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:18000
    volumes:
      - ./ui/deepanalyze_frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    restart: unless-stopped

  # open-webui:
